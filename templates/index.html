<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Emotion Detector – Analyze text emotions using Watson NLP">
    <title>Emotion Detector</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh; display: flex; align-items: center;
            justify-content: center; color: #e0e0e0;
        }
        .container {
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 20px; padding: 48px 40px;
            max-width: 600px; width: 90%; box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        h1 {
            font-size: 1.8rem; text-align: center; margin-bottom: 8px;
            background: linear-gradient(90deg, #a78bfa, #818cf8);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .subtitle { text-align: center; font-size: 0.9rem; color: #9ca3af; margin-bottom: 28px; }
        textarea {
            width: 100%; height: 120px; padding: 14px 16px;
            border: 1px solid rgba(255,255,255,0.15); border-radius: 12px;
            background: rgba(255,255,255,0.05); color: #f0f0f0;
            font-size: 1rem; resize: vertical; outline: none;
            transition: border-color 0.3s;
        }
        textarea:focus { border-color: #818cf8; }
        textarea::placeholder { color: #6b7280; }
        button {
            margin-top: 16px; width: 100%; padding: 14px;
            border: none; border-radius: 12px; cursor: pointer;
            font-size: 1rem; font-weight: 600;
            background: linear-gradient(135deg, #7c3aed, #6366f1);
            color: #fff; transition: transform 0.15s, box-shadow 0.3s;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(99,102,241,0.45); }
        button:active { transform: translateY(0); }
        #system_response {
            margin-top: 24px; padding: 18px; min-height: 48px;
            border-radius: 12px; font-size: 0.95rem; line-height: 1.6;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Emotion Detector</h1>
        <p class="subtitle">Powered by Watson NLP</p>
        <textarea id="textToAnalyze" placeholder="Type a sentence to analyze its emotions…"></textarea>
        <button id="analyzeBtn" onclick="RunSentimentAnalysis()">Analyze Emotion</button>
        <div id="system_response"></div>
    </div>
    <script src="/static/mywebscript.js"></script>
</body>
</html>
